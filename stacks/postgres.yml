# ─────────────────────────────────────────────────────────────────────────────
# PostgreSQL 14 — Banco de dados compartilhado
#
# Deploy: docker stack deploy -c stacks/postgres.yml postgres
# ─────────────────────────────────────────────────────────────────────────────

version: "3.8"

services:
  postgres:
    image: postgres:14
    environment:
      - POSTGRES_USER=${EVO_PG_USER:-postgres}
      - POSTGRES_PASSWORD=${EVO_PG_PASSWORD}
      - TZ=America/Sao_Paulo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - traefik_net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

volumes:
  postgres_data:

networks:
  traefik_net:
    external: true
    name: ${TRAEFIK_NETWORK:-klead}
